version: 1 

aws:
  sso:
    start_url: "https://my-company.awsapps.com/start"
    region: "us-east-1"
    account_id: "123456789012"
    role_name: "DeveloperAccess"
  profile_name: "Developer"
  region: "us-east-1"

artifact:
  domain: "my-company-domain"
  domain_owner: "123456789012"
  repository: "python-packages"
  region: "us-east-1"

package:
  uv_index_name: "internal"
  validation_package: "my-package"
  install_strategy: "add"

cli:
  log_level: "info"
  no_color: false
  non_interactive: false

features:
  codeartifact: true
  docker: false
  java: false
  terraform: false
  kubernetes: false
